<div id="task-injection" class="tab-content">
    <div class="tip-section">
        <div class="tip-content">
            <svg
                class="tip-icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
            </svg>
            <p class="tip-text" data-i18n="injection.tip">
                先从左侧选择一个节点，再为该节点单独编辑注入数据；每个节点会保留自己的草稿。
            </p>
        </div>
    </div>

    <div class="card-grid">
        <div class="card">
            <h3 class="card-title" data-i18n="injection.nodeSelection">
                节点浏览
            </h3>

            <div class="search-container">
                <svg
                    class="search-icon"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                    ></path>
                </svg>
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    data-i18n-placeholder="injection.searchPlaceholder"
                    placeholder="搜索节点..."
                />
            </div>

            <div class="node-list" id="node-list"></div>
        </div>

        <div class="card injection-editor-card">
            <h3 class="card-title" data-i18n="injection.dataInput">
                当前节点编辑
            </h3>

            <div class="editor-header">
                <div class="editor-node-meta">
                    <div
                        class="editor-caption"
                        data-i18n="injection.currentNode"
                    >
                        当前节点
                    </div>
                    <div class="editor-node-row">
                        <span
                            id="current-node-name"
                            class="current-node-name"
                            >未选择节点</span
                        >
                        <span
                            id="current-node-tag"
                            class="node-side-tag"
                        ></span>
                        <div class="editor-node-actions">
                            <button
                                id="inject-termination-btn"
                                class="btn-small btn-clear"
                                type="button"
                                data-i18n="injection.injectTermination"
                            >
                                注入终止符
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="json-input-section" class="json-input-section">
                <div class="json-header">
                    <label
                        class="json-label"
                        data-i18n="injection.jsonLabel"
                        >当前节点任务数据 (JSON格式)</label
                    >
                </div>
                <textarea
                    id="json-textarea"
                    class="json-textarea"
                    data-i18n-placeholder="injection.jsonPlaceholder"
                    placeholder="请选择一个节点后输入JSON格式的任务数据..."
                ></textarea>
                <div
                    id="json-validation"
                    class="validation-message"
                ></div>
            </div>

            <div class="editor-actions">
                <button
                    id="validate-json-btn"
                    class="btn-small btn-select"
                    type="button"
                    data-i18n="injection.validate"
                >
                    校验
                </button>
                <button
                    id="format-json-btn"
                    class="btn-small btn-select"
                    type="button"
                    data-i18n="injection.format"
                >
                    格式化
                </button>
                <button
                    id="clear-draft-btn"
                    class="btn-small btn-clear"
                    type="button"
                    data-i18n="injection.clearCurrentDraft"
                >
                    清空当前草稿
                </button>
            </div>
        </div>
    </div>

    <div class="card draft-card">
        <div class="card-title" data-i18n="injection.drafts">
            待发送数据预览
        </div>
        <pre id="draft-preview" class="draft-preview"></pre>
        <div class="submit-section">
            <div
                id="status-message"
                class="status-message"
                style="visibility: hidden"
            ></div>
            <button
                id="submit-btn"
                class="btn-submit"
                data-i18n="injection.submitAllDrafts"
            >
                提交所有草稿
            </button>
        </div>
    </div>
</div>
