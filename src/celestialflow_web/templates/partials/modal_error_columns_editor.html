<div id="errors-columns-editor-overlay" class="overlay hidden">
    <div
        id="errors-columns-editor"
        class="layout-editor error-columns-editor"
        role="dialog"
        aria-modal="true"
        aria-labelledby="errors-columns-editor-title"
    >
        <div class="layout-editor-header">
            <span
                id="errors-columns-editor-title"
                class="layout-editor-title"
                data-i18n="errors.columns.title"
                >表格字段</span
            >
            <button
                id="errors-columns-editor-close"
                class="settings-close"
                type="button"
                data-i18n-aria-label="settings.close"
                aria-label="关闭设置"
            >
                &times;
            </button>
        </div>
        <div class="error-columns-shell">
            <div class="layout-column">
                <div
                    class="layout-column-header"
                    data-i18n="errors.columns.visible"
                >
                    已显示字段
                </div>
                <div
                    class="layout-column-dropzone"
                    id="errors-columns-dropzone-visible"
                ></div>
            </div>
            <div class="layout-column">
                <div
                    class="layout-column-header"
                    data-i18n="errors.columns.hidden"
                >
                    未显示字段
                </div>
                <div
                    class="layout-column-dropzone"
                    id="errors-columns-dropzone-hidden"
                ></div>
            </div>
        </div>
        <div class="layout-editor-footer">
            <button
                id="errors-columns-save-btn"
                class="btn-layout-save"
                type="button"
                data-i18n="errors.columns.save"
            >
                保存并关闭
            </button>
            <button
                id="errors-columns-reset-btn"
                class="btn-layout-reset"
                type="button"
                data-i18n="errors.columns.reset"
            >
                重置默认
            </button>
        </div>
    </div>
</div>
